name: watchdog
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ensure bot run alive (dispatch if dark > 10 min)
        env:
          DEPLOY_PAT: ${{ secrets.DEPLOY_PAT }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          from datetime import datetime, timezone
          pat = os.environ["DEPLOY_PAT"]; repo = os.environ["REPO"]
          def gh(url, method="GET", data=None):
              r = urllib.request.Request(url, method=method,
                  headers={"Authorization": f"Bearer {pat}", "Accept": "application/vnd.github+json",
                           "User-Agent": "watchdog"},
                  data=json.dumps(data).encode() if data else None)
              return json.loads(urllib.request.urlopen(r, timeout=30).read() or b"{}")
          runs = gh(f"https://api.github.com/repos/{repo}/actions/workflows/bot.yml/runs?per_page=5")["workflow_runs"]
          now = datetime.now(timezone.utc)
          def age(iso): return (now - datetime.fromisoformat(iso.replace("Z","+00:00"))).total_seconds()
          active = [r for r in runs if r["status"] in ("in_progress", "queued", "waiting")]
          if active:
              print(f"bot alive/queued ({len(active)}) — no action"); raise SystemExit(0)
          ended = [r for r in runs if r.get("run_ended_at")]
          gap = min((age(r["run_ended_at"]) for r in ended), default=1e9)
          if gap < 600:
              print(f"last run ended {int(gap)}s ago — handover in progress, no action"); raise SystemExit(0)
          print(f"DARK for {int(gap/60)} min — dispatching bot.yml")
          gh(f"https://api.github.com/repos/{repo}/actions/workflows/bot.yml/dispatches", "POST", {"ref": "main"})
          print("dispatched ✓")
          PY
